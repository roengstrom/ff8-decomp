# Not a splat config. This is the input to tools/gen_splat_config.py,
# which expands it into one real splat config per binary under
# build/splat/. Run via `make splat-config`; `make split` does it for you.

# Written into every generated config. {name} is substituted with each
# binary's own name; a binary's own `options` override these.

defaults:
  name: "{name}"
  options:
    basename: "{name}"
    elf_path: build/ovl/{name}/{name}.elf
    # resolved relative to the generated yaml's own location
    base_path: ../..
    platform: psx
    compiler: PSYQ
    # Directory layout
    asm_path: asm/ovl/{name}
    src_path: src/{name}
    build_path: build/ovl/{name}
    # Linker
    ld_script_path: build/splat/{name}.ovl.ld
    ld_dependencies: true
    ld_align_section_vram_end: false
    ld_align_segment_vram_end: false
    # Symbols
    symbol_addrs_path:
    - config/symbols.shared.txt
    - config/symbols.{name}.txt
    undefined_funcs_auto_path: build/splat/undefined_funcs_auto.{name}.txt
    undefined_syms_auto_path: build/splat/undefined_syms_auto.{name}.txt
    disassemble_all: true
    # String detection
    string_encoding: ASCII
    data_string_encoding: ASCII
    rodata_string_guesser_level: 2
    data_string_guesser_level: 2
    # Misc
    section_order: [.text, .rodata, .data]
    subalign: 2
    o_as_suffix: true
    generate_asm_macros_files: false

binaries:
- name: battle
  sha1: fa3b045925c0cc8855b321f5dd22ff196f9d51b0
  options:
    target_path: original/battle.bin
    section_order: [.rodata, .text, .data, .bss]
  segments:
  - name: battle
    type: code
    start: 0x0
    vram: 0x80098000
    subsegments:
    # 0x0-0x1D30 is one contiguous rodata block that precedes all text.
    # The jump table at 0x0 belongs to func_80099D30, so it is part of
    # bc_object1's rodata and migrates into that function's .s file.
    # bc_dispatch_obf is raw data, not code.
    - [0x0, .rodata, bc_object1]
    - [0x30, rodata, bc_dispatch_obf]
    - [0x130, .rodata, bc_object2]
    - [0xA84, .rodata, bc_object3]
    - [0xECC, .rodata, bc_object4]
    - [0xF4C, .rodata, bc_object5]
    - [0xF90, .rodata, bc_object6]
