name: tripletriad.bin
sha1: accfe3831595f26c5d6de6f3891736521736f8ef
options:
  basename: tripletriad
  target_path: original/tripletriad.bin
  elf_path: build/ovl/tripletriad/tripletriad.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  # Directory layout
  asm_path: asm/ovl/tripletriad
  src_path: src/tripletriad
  build_path: build/ovl/tripletriad

  # Linker
  ld_script_path: config/tripletriad.ovl.ld
  ld_bss_is_noload: True  # the runtime state at 0x801A2C40+ is past the file image
  ld_dependencies: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  # Analysis
  find_file_boundaries: True
  disassemble_all: True

  # Symbols
  global_vram_start: 0x80098000
  global_vram_end: 0x801D4B38
  symbol_addrs_path:
    - config/symbol_addrs.tripletriad.txt
  undefined_funcs_auto_path: config/undefined_funcs_auto.tripletriad.txt
  undefined_syms_auto_path: config/undefined_syms_auto.tripletriad.txt

  # String detection
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  # Misc
  section_order: [".text", ".rodata", ".data", ".bss"]
  subalign: 2
  o_as_suffix: True
  use_legacy_include_asm: False
  generate_asm_macros_files: False

segments:
  - name: tripletriad
    type: code
    start: 0x0
    vram: 0x80098000
    bss_size: 0x31EF8
    subsegments:
      - { start: 0x0, type: .rodata, name: tt_text, linker_section_order: .text }   # formatString jump table
      - { start: 0xDC, type: .rodata, name: tt_match, linker_section_order: .text }
      - { start: 0x104, type: .rodata, name: tt_game, linker_section_order: .text }
      - { start: 0x154, type: .rodata, name: tt_card_scale, linker_section_order: .text }
      - { start: 0x164, type: .rodata, name: tt_script, linker_section_order: .text }
      - { start: 0x178, type: .rodata, name: tt_claim, linker_section_order: .text }
      - { start: 0x1A4, type: .rodata, name: tt_ui, linker_section_order: .text }
      - [0x1BC, c, tt_main]
      - [0xDD4, c, tt_text]
      - [0x1C78, c, tt_match]
      - [0x28CC, c, tt_game]
      - [0x6248, c, tt_script]
      - [0x95C8, c, tt_claim]
      - [0x9BE0, c, tt_ui]
      - { start: 0xC58C, type: .data, name: tt_state_table, linker_section_order: .text }  # g_tripleTriadStateHandlers[7]; last 2 entries zero (the former 8-byte "pad")
      - { start: 0xC5A8, type: .data, name: tt_clear_rects, linker_section_order: .text }
      - { start: 0xC5B8, type: .data, name: tt_tim_frames, linker_section_order: .text }   # 4bpp card frame TIM (assets/tripletriad_card_frames.tim)
      - { start: 0x1F1D8, type: .data, name: tt_tim_textbuf, linker_section_order: .text } # text-buffer TIM (assets/tripletriad_text_buffer.tim)
      - { start: 0x1F638, type: .data, name: tt_tim_cardart, linker_section_order: .text } # 8bpp card art TIM (assets/tripletriad_card_art.tim)
      - { start: 0x96658, type: .data, name: tt_tim_bg0, linker_section_order: .text }     # 16bpp board background 0 (assets/tripletriad_bg0.tim)
      - { start: 0xC066C, type: .data, name: tt_tim_bg1, linker_section_order: .text }     # 16bpp board background 1 (assets/tripletriad_bg1.tim)
      - { start: 0xEA680, type: .data, name: tt_rule_strings, linker_section_order: .text }  # rule-description string block (RuleStrTable + FF8-encoded labels)
      - { start: 0xEA7E4, type: .data, name: tt_card_stats, linker_section_order: .text }  # the 110-card stats table (g_tripleTriadCardStats)
      - { start: 0xEAB54, type: .data, name: tt_tables, linker_section_order: .text }       # text/render/AI/sfx-config tables
      - { start: 0xEAEC8, type: .data, name: tt_snd_akao, linker_section_order: .text }  # AKAO audio block (assets/tripletriad_akao.bin)
      - { start: 0x109B88, type: .data, name: tt_snd_bank, linker_section_order: .text } # sound-bank image (assets/tripletriad_sound_bank.bin)
      - { type: .bss, vram: 0x801A2C40, name: tt_bss }  # runtime state past the file image (tt_bss.c is the memory map)
  - [0x10AC40]
