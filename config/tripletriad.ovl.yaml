name: tripletriad.bin
sha1: accfe3831595f26c5d6de6f3891736521736f8ef
options:
  basename: tripletriad
  target_path: original/tripletriad.bin
  elf_path: build/ovl/tripletriad/tripletriad.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  # Directory layout
  asm_path: asm/ovl/tripletriad
  src_path: src/tripletriad
  build_path: build/ovl/tripletriad

  # Linker
  ld_script_path: config/tripletriad.ovl.ld
  ld_dependencies: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  # Analysis
  find_file_boundaries: True
  disassemble_all: True

  # Symbols
  symbol_addrs_path:
    - config/symbol_addrs.tripletriad.txt
  undefined_funcs_auto_path: config/undefined_funcs_auto.tripletriad.txt
  undefined_syms_auto_path: config/undefined_syms_auto.tripletriad.txt

  # String detection
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  # Misc
  section_order: [".text", ".rodata", ".data", ".bss"]
  subalign: 2
  o_as_suffix: True
  use_legacy_include_asm: False
  generate_asm_macros_files: False

segments:
  - name: tripletriad
    type: code
    start: 0x0
    vram: 0x80098000
    subsegments:
      - { start: 0x0, type: .rodata, name: be_object1, linker_section_order: .text }
      - { start: 0xDC, type: .rodata, name: be_object1b, linker_section_order: .text }
      - { start: 0x104, type: .rodata, name: be_object2, linker_section_order: .text }
      - { start: 0x154, type: .rodata, name: be_object2_data, linker_section_order: .text }
      - { start: 0x164, type: .rodata, name: be_object3, linker_section_order: .text }
      - { start: 0x178, type: .rodata, name: be_object3b, linker_section_order: .text }
      - { start: 0x1A4, type: .rodata, name: be_object4, linker_section_order: .text }
      - [0x1BC, c, be_dispatch]
      - [0x22C, c, be_object1]
      - [0x1C78, c, be_object1b]
      - [0x28CC, c, be_object2]
      - [0x6248, c, be_object3]
      - [0x95C8, c, be_object3b]
      - [0x9BE0, c, be_object4]
      - { start: 0xC58C, type: .data, name: be_state_table, linker_section_order: .text }
      - { start: 0xC5A0, type: data, name: be_state_table_pad, linker_section_order: .text }  # 8 bytes of inter-object filler (not alignment; 0xC5A0 is already 8-aligned)
      - { start: 0xC5A8, type: .data, name: be_object1_data, linker_section_order: .text }
      - { start: 0xC5B8, type: .data, name: be_tim_frames, linker_section_order: .text }   # 4bpp card frame TIM (assets/tripletriad_card_frames.tim)
      - { start: 0x1F1D8, type: .data, name: be_tim_textbuf, linker_section_order: .text } # text-buffer TIM (assets/tripletriad_text_buffer.tim)
      - { start: 0x1F638, type: .data, name: be_tim_cardart, linker_section_order: .text } # 8bpp card art TIM (assets/tripletriad_card_art.tim)
      - { start: 0x96658, type: data, name: be_data, linker_section_order: .text }  # data tables: animation data, sound bank, etc. (no code)
  - [0x10AC40]
